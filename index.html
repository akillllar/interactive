<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Левая часть с картинкой и градиентом -->
    <div class="left-side">
        <div class="bg-image"></div>
        <div class="fade-overlay"></div>
    </div>

    <!-- Плеер (справа) -->
    <div class="main-music-card">
        <!-- Скрытый чекбокс для Play/Pause -->
        <input type="checkbox" id="play-toggle" hidden>

        <!-- АУДИО ПЛЕЕР (скрыт) -->
        <audio id="audio-player" src="song1.mp3"></audio>

        <div class="track-info">
            <div class="album-art">
                <img src="cover1.jpg" alt="Cover" id="cover-img">
            </div>
            
            <div class="track-details">
                <div class="track-title" id="song-title">Soldiers Rage</div>
                <div class="artist-name" id="artist-name">Tha Mechanic</div>
            </div>
            
            <div class="volume-bars">
                <div class="bar" style="--delay:0s"></div>
                <div class="bar" style="--delay:0.1s"></div>
                <div class="bar" style="--delay:0.2s"></div>
                <div class="bar" style="--delay:0.3s"></div>
                <div class="bar" style="--delay:0.4s"></div>
                <div class="bar" style="--delay:0.5s"></div>
                <div class="bar" style="--delay:0.6s"></div>
                <div class="bar" style="--delay:0.7s"></div>
            </div>
        </div>

        <div class="playback-controls">
            <div class="time-info">
                <span class="current-time" id="current-time">0:00</span>
                <span class="remaining-time" id="duration">0:00</span>
            </div>
            
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-handle" id="progress-handle"></div>
            </div>
            
            <div class="button-row">
                <div class="main-control-btns">
                    <!-- Кнопка Назад -->
                    <button class="control-button back" id="prev-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M.5 3.5A.5.5 0 0 0 0 4v8a.5.5 0 0 0 1 0V8.753l6.267 3.636c.54.313 1.233-.066 1.233-.697v-2.94l6.267 3.636c.54.314 1.233-.065 1.233-.696V4.308c0-.63-.693-1.01-1.233-.696L8.5 7.248v-2.94c0-.63-.692-1.01-1.233-.696L1 7.248V4a.5.5 0 0 0-.5-.5"/>
                        </svg>
                    </button>
                    
                    <!-- Кнопка Play/Pause -->
                    <div class="play-pause-btns">
                        <label for="play-toggle" class="control-button play-pause-button" id="play-pause-label">
                            <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M11.596 8.697l-6.363 3.692c-.54.314-1.233-.065-1.233-.696V4.308c0-.63.693-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
                            </svg>
                            <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"/>
                            </svg>
                        </label>
                    </div>

                    <!-- Кнопка Вперед (Next) -->
                    <button class="control-button next" id="next-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M15.5 3.5a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V8.753l-6.267 3.636c-.54.313-1.233-.066-1.233-.697v-2.94l-6.267 3.636C.693 12.703 0 12.324 0 11.693V4.308c0-.63.693-1.01 1.233-.696L7.5 7.248v-2.94c0-.63.693-1.01 1.233-.696L15 7.248V4a.5.5 0 0 1 .5-.5"/>
                        </svg>
                    </button>
                </div>
                
                <button class="control-button d">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M6.634 1.135A7 7 0 0 1 15 8a.5.5 0 0 1-1 0 6 6 0 1 0-6.5 5.98v-1.005A5 5 0 1 1 13 8a.5.5 0 0 1-1 0 4 4 0 1 0-4.5 3.969v-1.011A2.999 2.999 0 1 1 11 8a.5.5 0 0 1-1 0 2 2 0 1 0-2.5 1.936v-1.07a1 1 0 1 1 1 0V15.5a.5.5 0 0 1-1 0v-.518a7 7 0 0 1-.866-13.847"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

        <script>
        // --- СПИСОК 12 ПЕСЕН ---
        const tracks = [
            { title: "Твоё имя",  artist: "Монеточка",   cover: "cover1.jpg",  audio: "song1.mp3" },
            { title: "Последняя дискотека", artist: "Монеточка",  cover: "cover2.jpg",  audio: "song2.mp3" },
            { title: "Проститься",        artist: "Uma2rman",       cover: "cover3.jpg",  audio: "song3.mp3" },
            { title: "Адажио",        artist: " ",       cover: "cover4.jpg",  audio: "song4.mp3" },
            { title: "Вселенная бесконечна",        artist: "Noize MC",       cover: "cover5.jpg",  audio: "song5.mp3" },
            { title: "Любовь HD1080",        artist: "Каспийский груз",       cover: "cover6.jpg",  audio: "song6.mp3" },
            { title: "Бухгалтер",        artist: "Комбинация",       cover: "cover7.jpg",  audio: "song7.mp3" },
            { title: "Маленький",        artist: "Дайте танк",       cover: "cover8.jpg",  audio: "song8.mp3" },
            { title: "CHIHIRO",        artist: "Billie Eilish",       cover: "cover9.jpg",  audio: "song9.mp3" },
            { title: "Ты мне веришь?",       artist: " ",      cover: "cover10.jpg", audio: "song10.mp3" },
            { title: "Звёзды",       artist: "N1NT3ND0",      cover: "cover11.jpg", audio: "song11.mp3" },
            { title: "Ран Вася Ран",       artist: "N1NT3ND0",      cover: "cover12.jpg", audio: "song12.mp3" }
        ];

        // --- СПИСОК 12 ЦВЕТОВ ---
        const colors = [
            '#FF3334', '#FD77BC', '#FFC15A', '#73EFF9', 
            '#FFFFFF', '#898989', '#FC9C46', '#784408', 
            '#3262FF', '#B7E17B', '#9F63C8', '#000000'
        ];

        let currentTrackIndex = 0;
        let currentColorIndex = 0;
        
        const audio = document.getElementById('audio-player');
        const playToggle = document.getElementById('play-toggle');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const playerCard = document.querySelector('.main-music-card');
        
        const coverImg = document.getElementById('cover-img');
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        
        const progressFill = document.getElementById('progress-fill');
        const progressHandle = document.getElementById('progress-handle');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');

        // Функция загрузки трека
        function loadTrack(index) {
            const track = tracks[index];
            audio.src = track.audio;
            coverImg.src = track.cover;
            songTitle.textContent = track.title;
            artistName.textContent = track.artist;
            
            progressFill.style.width = '0%';
            progressHandle.style.left = '0%';
            currentTimeEl.textContent = '0:00';
            durationEl.textContent = '0:00';
            
            if (playToggle.checked) {
                audio.play().catch(e => console.log("Ошибка воспроизведения:", e));
            }
        }

        // Форматирование времени
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Play/Pause
        playToggle.addEventListener('change', () => {
            if (playToggle.checked) {
                audio.play().catch(e => console.log("Ошибка:", e));
            } else {
                audio.pause();
            }
        });

        // Next (Следующий трек + Смена цвета)
        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
            
            currentColorIndex = (currentColorIndex + 1) % colors.length;
            playerCard.style.setProperty('--theme-color', colors[currentColorIndex]);
        });

        // Prev (Предыдущий трек + Смена цвета) — ИСПРАВЛЕНО
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            
            // Меняем цвет и при нажатии "Назад"
            currentColorIndex = (currentColorIndex - 1 + colors.length) % colors.length;
            playerCard.style.setProperty('--theme-color', colors[currentColorIndex]);
        });

        // Обновление прогресса
        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                progressHandle.style.left = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        // Перемотка по клику
        const progressBar = document.getElementById('progress-bar');
        progressBar.addEventListener('click', (e) => {
            if (audio.duration && !isNaN(audio.duration)) {
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
            }
        });

        // Инициализация
        loadTrack(0);
    </script>

</body>
</html>
